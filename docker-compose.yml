
services:
  postgres:
    image: postgres:15
    container_name: reachinbox_postgres
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reachinbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: reachinbox_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: reachinbox_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: reachinbox_backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://reachinbox:password@postgres:5432/reachinbox_db?schema=public
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SESSION_SECRET=my_super_secret_session_key
      - ENCRYPTION_KEY=my_super_secret_32_byte_encryption_key_12345!
      - DEFAULT_EMAIL_DELAY_MS=2000
      - DEFAULT_MAX_EMAILS_PER_HOUR=100
      - MAX_RETRIES=3
      - MAX_LEADS_PER_REQUEST=10000
      - BULL_BOARD_USERNAME=admin
      - BULL_BOARD_PASSWORD=admin
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: development
    container_name: reachinbox_worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://reachinbox:password@postgres:5432/reachinbox_db?schema=public
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ENCRYPTION_KEY=my_super_secret_32_byte_encryption_key_12345!
      - WORKER_CONCURRENCY=8
      - MAX_RETRIES=3
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run worker:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: reachinbox_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
